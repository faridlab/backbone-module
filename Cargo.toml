[package]
name = "backbone-module-skeleton"
version = "0.1.18"
edition = "2021"
description = "Minimal Backbone Framework module skeleton"
license = "MIT OR Apache-2.0"
# `metaphor module create` rewrites this to the new module's own repository.
repository = "https://github.com/faridlab/backbone-module"
# The skeleton itself is a template and is never published. `metaphor module
# create` drops this line, so every module it creates is publishable.
publish = false
# Modules are published to crates.io. Keep agent tooling and local analysis out of
# the package; migrations/ and schema/ must stay in, since consumers read them.
exclude = [".claude/", ".github/", "graphify-out/"]

[lib]
path = "src/lib.rs"

[dependencies]
# -----------------------------------------------------------------------------
# Backbone Framework crates, from crates.io
#
# A requirement like "2.7.35" accepts any compatible later framework release,
# and `cargo update` moves the lockfile onto it, so a framework release never
# needs an edit here. Every framework crate is released at the same version.
# To build against an unreleased framework change, add an untracked
# .cargo/config.toml with a [patch.crates-io] entry pointing at a local
# checkout; never commit a [patch] section.
# -----------------------------------------------------------------------------
backbone-core = { version = "2.7.35", features = ["postgres"] }
backbone-orm = "2.7.35"
backbone-auth = "2.7.35"
backbone-messaging = "2.7.35"

# Core async runtime and serialization
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# Money/quantities — near-universal in domain modules. Generated code for any `decimal`
# field imports rust_decimal, so ship it (and the matching sqlx feature) by default.
rust_decimal = { version = "1.36", features = ["serde"] }

# Database (PostgreSQL primary)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "rust_decimal"] }

# HTTP framework (Axum)
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Validation
validator = { version = "0.16", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Configuration
config = "0.14"
serde_yaml = "0.9"

# Protocol Buffers (Generated from Schema-First YAML)
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"

[features]
default = []
events = []
auth = []
grpc = []
openapi = []
validation = []

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3.0"
tokio-test = "0.4"
mockall = "0.12"
pretty_assertions = "1.0"

# Integration testing framework — the generated tests/integration_tests.rs hits a live server
# via reqwest; guarded-route probes hit the router in-process via tower's ServiceExt::oneshot.
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
jsonwebtoken = "9.3"
rand = "0.8"
